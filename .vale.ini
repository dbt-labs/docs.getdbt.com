StylesPath = styles
MinAlertLevel = warning

Vocab = EN

[*.md]
BasedOnStyles = custom

# The product-naming rule is scoped to docs + snippets, matching the rename's own
# scope. Blogs and release notes are historical records and keep their original
# product names. Release notes live in two places: a release-notes/ subdirectory
# and top-level *-release-notes.md files directly under dbt-versions/.
[website/blog/**/*.md]
custom.Terminology = NO

[website/docs/docs/dbt-versions/release-notes/**/*.md]
custom.Terminology = NO

[website/docs/docs/dbt-versions/*release-note*.md]
custom.Terminology = NO

# "Fusion admin" is a real permission-set name (see config/never-touch.yml), not a
# product reference. Vale's substitution engine uses RE2, which has no lookahead,
# so the rule can't exempt the phrase directly — exempt the pages that document it.
[website/docs/docs/platform/manage-access/enterprise-permissions.md]
custom.Terminology = NO

[website/snippets/_enterprise-permissions-table.md]
custom.Terminology = NO

[website/docs/docs/dbt-versions/upgrade-dbt-platform-version.md]
custom.Terminology = NO

[website/docs/guides/dbt-upgrade.md]
custom.Terminology = NO

# Build-time generated snippets (gitignored). Their wording comes from the
# generator or an upstream README, not from this repo's prose.
[website/snippets/_functions-table-*.md]
custom.Terminology = NO

[website/snippets/_mcp-tools-from-readme.md]
custom.Terminology = NO
