name: Vercel deployment preview link generator

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'website/docs/docs/**'
      - 'website/docs/best-practices/**'
      - 'website/docs/guides/**'
      - 'website/docs/faqs/**'
      - 'website/docs/reference/**'

permissions:
  contents: read
  deployments: read
  pull-requests: write

# A newer push makes the older run's preview links stale, so cancel it
concurrency:
  group: preview-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-pr-description:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Update PR description with preview links
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // 1. Wait for the Vercel bot's GitHub deployment on this commit to succeed.
            //    Returns that build's own URL (it changes every build), used only as a fallback.
            async function waitForDeployment() {
              const maxAttempts = 60; // 60 x 15s = 15 minutes
              for (let i = 0; i < maxAttempts; i++) {
                const { data: deployments } = await github.rest.repos.listDeployments({
                  owner,
                  repo,
                  sha: pr.head.sha,
                  per_page: 100,
                });
                const vercel = deployments.filter((d) => d.creator?.login === 'vercel[bot]');

                for (const deployment of vercel) {
                  const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    per_page: 1, // newest first
                  });
                  const latest = statuses[0];
                  if (latest?.state === 'success') {
                    return latest.environment_url || latest.target_url;
                  }
                  if (latest && ['failure', 'error'].includes(latest.state)) {
                    core.warning(`Vercel deployment ${latest.state}. See ${latest.target_url}`);
                    return null;
                  }
                }

                core.info(`Deployment not ready yet (attempt ${i + 1}/${maxAttempts}). Waiting...`);
                await sleep(15000);
              }
              core.warning('Vercel deployment did not finish within 15 minutes.');
              return null;
            }

            // 2. Work out each page's URL. Docusaurus uses frontmatter `slug`, then `id`, then the file name.
            function readFrontmatter(file) {
              const text = fs.readFileSync(file, 'utf8');
              const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
              const fm = {};
              if (!match) return fm;
              for (const line of match[1].split(/\r?\n/)) {
                const m = line.match(/^(id|slug):\s*(.+?)\s*$/);
                if (m) fm[m[1]] = m[2].replace(/^["']|["']$/g, '');
              }
              return fm;
            }

            function pageRoute(file) {
              const rel = file.replace(/^website\/docs\//, '');
              const dir = path.posix.dirname(rel);
              const base = path.posix.basename(rel).replace(/\.mdx?$/, '');
              const { id, slug } = readFrontmatter(file);

              if (slug) {
                if (slug.startsWith('/')) return slug.replace(/\/$/, '');
                return path.posix.join(dir, slug);
              }

              const name = id || base;
              const dirName = path.posix.basename(dir);
              // index.md, README.md, and a file named after its folder all map to the folder URL
              if (['index', 'readme'].includes(name.toLowerCase()) || name === dirName) {
                return dir === '.' ? '' : dir;
              }
              return dir === '.' ? name : `${dir}/${name}`;
            }

            // The stable branch alias is <project>-git-<branch>-<team>.vercel.app. Fork PRs
            // get a `fork-<owner>-` prefix. Vercel truncates and hashes labels over 63
            // characters, and that hash can't be computed, so those use the build URL instead.
            function branchAliasUrl() {
              const sanitize = (v) => v.toLowerCase().replace(/[^a-z0-9]/g, '-');
              const isFork = pr.head.repo.full_name !== pr.base.repo.full_name;
              const branch = sanitize(
                isFork ? `fork-${pr.head.repo.owner.login}-${pr.head.ref}` : pr.head.ref,
              );
              const label = `docs-getdbt-com-git-${branch}-dbt-labs`;
              return label.length <= 63 ? `https://${label}.vercel.app` : null;
            }

            const buildUrl = await waitForDeployment();
            if (!buildUrl) {
              core.warning('Skipping PR description update: Vercel deployment not ready.');
              return;
            }
            const baseUrl = (branchAliasUrl() || buildUrl).replace(/\/$/, '');
            core.info(`Using preview URL: ${baseUrl}`);

            // Only added or modified pages. Deleted pages have no preview.
            const changedFiles = execFileSync(
              'git',
              ['diff', '--name-only', '--diff-filter=AMR', pr.base.sha, pr.head.sha],
              { encoding: 'utf8' },
            )
              .split('\n')
              .filter((f) => /^website\/docs\/(docs|best-practices|guides|faqs|reference)\/.*\.mdx?$/.test(f));

            const links = changedFiles.length
              ? changedFiles.map((f) => `- ${baseUrl}/${pageRoute(f)}`.replace(/\/$/, '')).join('\n')
              : 'No documentation files were changed.';

            // 3. Replace the preview block in the PR description
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });

            const startMarker = '<!-- vercel-deployment-preview -->';
            const endMarker = '<!-- end-vercel-deployment-preview -->';

            const deploymentContent = [
              startMarker,
              '---',
              '🚀 Deployment available! Here are the direct links to the updated files:',
              '',
              links,
              '',
              endMarker,
            ].join('\n');

            const regex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, 'g');
            const body = `${(pullRequest.body || '').replace(regex, '').trim()}\n\n${deploymentContent}`;

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              body,
            });
