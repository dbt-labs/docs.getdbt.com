name: Dotty metrics dashboard

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:       # Manual trigger from GitHub Actions UI
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Dotty metrics aggregator
        run: node scripts/dotty-metrics.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_DASH }}
          RUNLAYER_API_TOKEN: ${{ secrets.RUNLAYER_API_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}

      - name: Commit database IDs to config if created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet scripts/dotty-metrics-config.json; then
            echo "No config changes"
          else
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/dbt-labs/docs-internal.git"
            git add scripts/dotty-metrics-config.json
            git commit -m "chore: save Notion database IDs [skip ci]"
            git push
          fi
