name: Dotty Metrics Dashboard

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:       # Manual trigger from GitHub Actions UI
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Dotty metrics aggregator
        run: node scripts/dotty-metrics.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN_DASH }}
          RUNLAYER_API_TOKEN: ${{ secrets.RUNLAYER_API_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
