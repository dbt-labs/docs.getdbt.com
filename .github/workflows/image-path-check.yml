name: Check image paths

on:
  pull_request:
    paths:
      - "website/docs/**/*.md"
      - "website/docs/**/*.mdx"
      - "website/snippets/**/*.md"
      - "website/snippets/**/*.mdx"
      - "website/blog/**/*.md"
      - "website/blog/**/*.mdx"
      - "website/static/**"

jobs:
  check-image-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}" \
            -- 'website/docs/**/*.md' 'website/docs/**/*.mdx' \
               'website/snippets/**/*.md' 'website/snippets/**/*.mdx' \
               'website/blog/**/*.md' 'website/blog/**/*.mdx' \
            > changed_files.txt
          cat changed_files.txt

      - name: Check for broken local image paths
        run: |
          if [ -s changed_files.txt ]; then
            node .github/scripts/check-image-paths.js $(cat changed_files.txt)
          else
            echo "No doc files changed."
          fi
