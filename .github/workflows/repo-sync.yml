name: Repo Sync

# **What it does**: Syncs docs.getdbt.com public repo into the docs private repo
# This GitHub Actions workflow keeps the `current` branch of those two repos in sync.
# **Why we have it**: To keep the open-source repository up-to-date
# while still having an internal repository for sensitive work.
# For more details, see https://github.com/repo-sync/repo-sync#how-it-works

on:
  schedule:
    - cron: '0 6,12,18 * * *' # Run at 6:00 AM, 12:00 PM, and 6:00 PM

jobs:
  repo-sync:
    permissions:
      contents: write
      pull-requests: write
    name: Repo Sync
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3
      with:
        # Use the INTERMEDIATE_BRANCH as the checkout reference
        ref: ${{ secrets.INTERMEDIATE_BRANCH }}
        token: ${{ secrets.GITHUB_TOKEN }}
        # Fetch all history for all branches and tags
        fetch-depth: 0  

    # Sync the source repo to the destination branch using repo-sync/github-sync
    - uses: repo-sync/github-sync@3832fe8e2be32372e1b3970bbae8e7079edeec88 # repo-sync/github-sync@v2
      name: Sync repo to branch
      with:
        # Source repository to sync from
        source_repo: ${{ secrets.SOURCE_REPO }}
        # Source branch to sync from
        source_branch: current
        # Destination branch to sync to
        destination_branch: ${{ secrets.INTERMEDIATE_BRANCH }}
        github_token: ${{ secrets.WORKFLOW_TOKEN }}

    - name: Ship pull request
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # actions/github-script@v6
      with:
        github-token: ${{ secrets.WORKFLOW_TOKEN }}
        result-encoding: string
        script: |
            const {owner, repo} = context.repo;
            const head = '${{ secrets.INTERMEDIATE_BRANCH }}';
            const base = 'current'

            async function closePullRequest(prNumber) {
              console.log('closing PR', prNumber)
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: 'closed'
              });
              console.log('closed PR', prNumber)
            }

            // GitHub computes mergeability asynchronously, so a freshly created
            // PR reports `mergeable: null` / `mergeable_state: 'unknown'`. Poll
            // until it settles instead of trusting the create response.
            async function waitForMergeability(prNumber) {
              for (let attempt = 0; attempt < 10; attempt++) {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber })
                if (data.mergeable !== null) return data
                await new Promise(resolve => setTimeout(resolve, 5000))
              }
              // Never settled. Fall through and let the merge call decide, which
              // is what this workflow did before it polled at all. Failing here
              // would block syncs that would otherwise have gone through.
              console.log('Mergeability did not settle in time; attempting the merge anyway')
              return null
            }

            // Reuse a sync PR left open by an earlier run. Without this, one
            // conflicted PR wedges every later run with a misleading 422
            // "A pull request already exists" from pulls.create.
            let pull
            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              base,
              head: `${owner}:${head}`,
              state: 'open',
            })

            // Re-check head and base locally rather than trusting the server-side
            // filter. Everything below merges `pull` into `base`, so picking up
            // the wrong PR here would merge unrelated work into the docs.
            const existing = openPulls.find(p =>
              p.head.ref === head &&
              p.base.ref === base &&
              p.head.repo && p.head.repo.full_name === `${owner}/${repo}`
            )

            if (existing) {
              pull = existing
              console.log('Reusing existing PR', pull.html_url)
            } else {
              console.log('Creating new PR')
              try {
                const response = await github.rest.pulls.create({
                  owner,
                  repo,
                  head,
                  base,
                  title: 'REPO SYNC - Public to Private',
                  body: 'This is an automated pull request to sync changes between the public and private repos.',
                });
                pull = response.data
                console.log('Created pull request successfully', pull.html_url)

              } catch (err) {
                // Don't error/alert if there's no commits to sync
                if (err.message?.includes('No commits')) {
                  console.log(err.message)
                  return
                }
                throw err
              }
            }

            const pull_number = pull.number

            const { data: prFiles } = await github.rest.pulls.listFiles({ owner, repo, pull_number })
            if (prFiles.length) {
              console.log(prFiles.length, 'files have changed')
            } else {
              console.log('No files changed, closing')
              await closePullRequest(pull_number)
              return
            }

            console.log('Checking for merge conflicts')
            const mergeablePull = await waitForMergeability(pull_number)
            if (mergeablePull && (!mergeablePull.mergeable || mergeablePull.mergeable_state === 'dirty')) {
              // Leave the PR open so the conflict can be resolved on it. The
              // reuse branch above lets later runs pick it back up.
              throw new Error(`PR has a conflict, please resolve manually: ${pull.html_url}`)
            }
            console.log('No detected merge conflicts')

            console.log('Merging the PR')
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              merge_method: 'merge',
            })
            console.log('Merged the PR successfully')
