name: Auto-approval audit

# Weekly feedback loop for the auto-approve bot. Lists every PR the bot approved
# that merged in the last 7 days or is still open, so a human can spot calls it
# got wrong, and flags any that were reverted.
#
# Opens a GitHub issue when there is anything to report. A Runlayer agent posts
# the Slack summary and updates the "Auto approved PRs" Notion database.
#
# Nothing here is automatic-corrective by design: the point is that a person
# reads the list and tightens safe-file-patterns.txt or the thresholds.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          sparse-checkout: .github

      - uses: actions/github-script@v7
        with:
          script: |
            const summary = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/auto-approve-summary.js`)
            await summary({ github, context, core })
