name: Auto-approval audit

# Weekly feedback loop for the auto-approve bot. Lists every PR the bot approved
# that merged in the last 7 days or is still open, so a human can spot calls it
# got wrong, and flags any that were reverted.
#
# Reports to three places:
#   - A GitHub issue (always, when there is anything to report)
#   - Slack, if the SLACK_WEBHOOK_URL secret is set
#   - The "Auto approved PRs" Notion database, if the NOTION_TOKEN secret is set
#
# Nothing here is automatic-corrective by design: the point is that a person
# reads the list and tightens safe-file-patterns.txt or the thresholds.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          sparse-checkout: .github

      - uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # "Auto approved PRs" data source in Notion. Not a secret.
          NOTION_DATA_SOURCE_ID: 3eabb38e-bda7-80ce-b073-000b6ae44a70
        with:
          script: |
            const summary = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/auto-approve-summary.js`)
            await summary({ github, context, core })
