name: Triage — Nightly Issue Scoring

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  score-issues:
    name: Score all open issues
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout docs-internal
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DOCS_AI_AGENT }}

      - name: Ensure triage/state directory exists
        run: mkdir -p triage/state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install claude-agent-sdk httpx

      - name: Run scoring agent
        run: |
          python triage/agent.py "Read triage/TRIAGE_AGENTS.md and triage/config.json, then execute the /score-issues skill exactly as documented in .claude/skills/score-issues/SKILL.md. Write results to triage/state/scores.json and triage/state/last_run.json."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNLAYER_CLIENT_ID: ${{ secrets.RUNLAYER_CLIENT_ID }}
          RUNLAYER_CLIENT_SECRET: ${{ secrets.RUNLAYER_CLIENT_SECRET }}
          RUNLAYER_MCP_SERVER_ID: ${{ secrets.RUNLAYER_MCP_SERVER_ID }}

      - name: Commit scoring results
        run: |
          git config user.name "docs-triage-bot"
          git config user.email "docs-triage-bot@dbt-labs.com"
          git add triage/state/
          git diff --staged --quiet || git commit -m "chore: nightly triage scoring $(date -u +%Y-%m-%d)"
          git push
