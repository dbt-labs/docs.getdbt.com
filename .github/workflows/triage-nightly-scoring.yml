name: Triage — Nightly Issue Scoring

# Scores all open issues nightly and writes results to triage/state/
# Runs at midnight UTC. Can also be triggered manually from the Actions tab.

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC every day
  workflow_dispatch:       # manual trigger

jobs:
  score-issues:
    name: Score all open issues
    runs-on: ubuntu-latest
    permissions:
      contents: write     # to commit triage/state/ back to docs-internal
      issues: read

    steps:
      - name: Checkout docs-internal
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DOCS_AI_AGENT }}

      - name: Ensure triage/state directory exists
        run: mkdir -p triage/state

      - name: Configure Claude Code MCP servers (Runlayer)
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/mcp_servers.json << 'EOF'
          {
            "mcpServers": {
              "runlayer": {
                "command": "npx",
                "args": ["-y", "@runlayer/mcp-server"],
                "env": {
                  "RUNLAYER_CLIENT_ID": "${{ secrets.RUNLAYER_CLIENT_ID }}",
                  "RUNLAYER_CLIENT_SECRET": "${{ secrets.RUNLAYER_CLIENT_SECRET }}"
                }
              }
            }
          }
          EOF

      - name: Run score-issues skill
        uses: anthropics/claude-code-action@beta
        with:
          use_bedrock: true
          direct_prompt: |
            Read triage/TRIAGE_AGENTS.md and triage/config.json, then execute the /score-issues skill exactly as documented in .claude/skills/score-issues/SKILL.md.
            Write results to triage/state/scores.json and triage/state/last_run.json.
          github_token: ${{ secrets.DOCS_AI_AGENT }}
          allowed_tools: >
            mcp__github__list_issues,
            mcp__github__issue_read,
            Write,
            Read,
            Bash
          timeout_minutes: 30
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEDROCK_TOKEN }}
          AWS_REGION: us-east-1

      - name: Commit scoring results
        run: |
          git config user.name "docs-triage-bot"
          git config user.email "docs-triage-bot@dbt-labs.com"
          git add triage/state/
          git diff --staged --quiet || git commit -m "chore: nightly triage scoring $(date -u +%Y-%m-%d)"
          git push
