name: Triage — Monday Slack Digest

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  monday-digest:
    name: Send Monday Slack digest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout docs-internal
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install claude-agent-sdk httpx

      - name: Run digest agent
        run: |
          python triage/agent.py "Read triage/TRIAGE_AGENTS.md and triage/config.json, then execute the monday-digest skill exactly as documented in .claude/skills/monday-digest/SKILL.md. If triage/state/scores.json is missing or older than 24 hours, run the score-issues skill first (see .claude/skills/score-issues/SKILL.md), then send the digest."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNLAYER_CLIENT_ID: ${{ secrets.RUNLAYER_CLIENT_ID }}
          RUNLAYER_CLIENT_SECRET: ${{ secrets.RUNLAYER_CLIENT_SECRET }}
          RUNLAYER_MCP_SERVER_ID: ${{ secrets.RUNLAYER_MCP_SERVER_ID }}
