name: Update platform function support data

on:
  schedule:
    - cron: '0 6 * * *' # daily at 6am UTC
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platform IDs to update (leave blank for all)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false # let other platforms succeed even if one fails
      matrix:
        platform: [snowflake, databricks, redshift, bigquery, trino, duckdb]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Check if platform is in requested list
        id: should_run
        run: |
          INPUT="${{ github.event.inputs.platforms }}"
          if [ -z "$INPUT" ] || echo ",$INPUT," | grep -q ",${{ matrix.platform }},"; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch and validate function data
        if: steps.should_run.outputs.run == 'true'
        run: node website/scripts/fetch-platform-functions.js ${{ matrix.platform }}
        env:
          FUSION_REPO_TOKEN: ${{ secrets.FUSION_REPO_TOKEN }}
          FUSION_REPO: ${{ secrets.FUSION_REPO }}
          FUSION_BASE_PATH: ${{ secrets.FUSION_BASE_PATH }}

      - name: Commit updated data if changed
        if: steps.should_run.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/static/data/functions/${{ matrix.platform }}.json
          git diff --staged --quiet || git commit -m "chore: update ${{ matrix.platform }} function support data [skip ci]"
          git push
