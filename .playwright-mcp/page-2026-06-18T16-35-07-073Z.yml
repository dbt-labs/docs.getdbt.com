                - heading "Fusion function support" [level=1] [ref=e203]
                - paragraph [ref=e204]: Fusion can typecheck your SQL during static analysis — catching a wrong argument type or a misspelled function before you ever run a model. Support is tracked per data platform, since every warehouse ships its own set of built-in functions.
