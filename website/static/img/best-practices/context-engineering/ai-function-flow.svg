<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How a context model uses an LLM</title>
  <desc id="desc">Step 1: your context model, a dbt file, has a classify macro call in it. Step 2: when dbt builds it, the macro writes a call to the warehouse AI function, AI_CLASSIFY on Snowflake, one call per chunk. Step 3: the LLM behind the function reads each chunk and answers with a label from your list. Step 4: your context model saves the answers as a new column in a table.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="350" rx="14" fill="#FFFFFF"/>

  <!-- Panels -->
  <rect x="20" y="20" width="210" height="315" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="265" y="20" width="210" height="315" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="510" y="20" width="210" height="315" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="755" y="20" width="225" height="315" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>

  <!-- Step badges -->
  <g font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="44" cy="40" r="11" fill="#C2410C"/><text x="44" y="44">1</text>
    <circle cx="289" cy="40" r="11" fill="#C2410C"/><text x="289" y="44">2</text>
    <circle cx="534" cy="40" r="11" fill="#C2410C"/><text x="534" y="44">3</text>
    <circle cx="779" cy="40" r="11" fill="#C2410C"/><text x="779" y="44">4</text>
  </g>

  <!-- Headers -->
  <text x="130" y="44" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C" dx="8">YOU WRITE THIS</text>
  <text x="130" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Context model</text>
  <text x="130" y="79" text-anchor="middle" font-size="11" fill="#4B5563">A dbt file in your project</text>

  <text x="375" y="44" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C" dx="8">YOUR WAREHOUSE</text>
  <text x="375" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">AI function</text>
  <text x="375" y="79" text-anchor="middle" font-size="11" fill="#4B5563">Built into your warehouse</text>

  <text x="620" y="44" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C" dx="8">THE MODEL</text>
  <text x="620" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">LLM</text>
  <text x="620" y="79" text-anchor="middle" font-size="11" fill="#4B5563">Not part of your project</text>

  <text x="867" y="44" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C" dx="8">YOU GET</text>
  <text x="867" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">A new column</text>
  <text x="867" y="79" text-anchor="middle" font-size="11" fill="#4B5563">Saved by your context model</text>

  <!-- Arrows between panels -->
  <g stroke="#8b93a1" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="232" y1="185" x2="263" y2="185"/>
    <line x1="477" y1="185" x2="508" y2="185"/>
    <line x1="722" y1="185" x2="753" y2="185"/>
  </g>

  <!-- Panel 1: the context model file -->
  <rect x="32" y="100" width="186" height="170" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#374151">
    <text x="40" y="119" font-weight="700" fill="#1F2937" font-size="9.5">call_transcripts_classify.sql</text>
    <line x1="40" y1="127" x2="210" y2="127" stroke="#D1D5DB" stroke-width="1"/>
    <text x="40" y="148">select</text>
    <text x="40" y="164">  chunk_id,</text>
    <rect x="38" y="172" width="172" height="18" rx="4" fill="#FFE9E3" stroke="#FF694A" stroke-width="1"/>
    <text x="40" y="185" font-weight="700" fill="#1F2937">  classify(chunk_text, …)</text>
    <text x="40" y="204">    as content_type</text>
    <text x="40" y="220">from chunk_transcripts</text>
  </g>
  <rect x="40" y="292" width="170" height="24" rx="12" fill="#ECFDF5" stroke="#2F9E6E" stroke-width="1.2"/>
  <text x="125" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">No AI cost on its own</text>

  <!-- Panel 2: macro to warehouse function -->
  <rect x="277" y="100" width="186" height="62" rx="8" fill="#FFE9E3" stroke="#FF694A" stroke-width="1.5"/>
  <text x="370" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">classify()</text>
  <text x="370" y="141" text-anchor="middle" font-size="10" fill="#4B5563">The package macro writes</text>
  <text x="370" y="154" text-anchor="middle" font-size="10" fill="#4B5563">your warehouse's function call</text>
  <line x1="370" y1="164" x2="370" y2="182" stroke="#8b93a1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="277" y="184" width="186" height="86" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="289" y="203" font-size="10" font-weight="700" fill="#6B7280">WAREHOUSE FUNCTION</text>
  <text x="289" y="226" font-size="13" font-weight="700" fill="#1F2937" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AI_CLASSIFY</text>
  <text x="289" y="244" font-size="10" fill="#4B5563">On Snowflake. Databricks and</text>
  <text x="289" y="257" font-size="10" fill="#4B5563">BigQuery have their own.</text>
  <rect x="275" y="292" width="190" height="24" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="370" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">One call per chunk</text>

  <!-- Panel 3: the LLM -->
  <rect x="522" y="100" width="186" height="170" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="534" y="112" width="162" height="62" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
  <text x="544" y="128" font-size="10" font-weight="700" fill="#6B7280">ONE CHUNK</text>
  <text x="544" y="146" font-size="10" fill="#1F2937">“Not sure we can renew</text>
  <text x="544" y="160" font-size="10" fill="#1F2937">at this price.”</text>
  <line x1="615" y1="176" x2="615" y2="194" stroke="#8b93a1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="567" y="196" width="96" height="26" rx="13" fill="#FFE9E3" stroke="#FF694A" stroke-width="1.5"/>
  <text x="615" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">objection</text>
  <text x="615" y="242" text-anchor="middle" font-size="10" fill="#4B5563">Reads the chunk and picks</text>
  <text x="615" y="256" text-anchor="middle" font-size="10" fill="#4B5563">a label from your list</text>
  <rect x="520" y="292" width="190" height="24" rx="12" fill="#FFE9E3" stroke="#FF694A" stroke-width="1.2"/>
  <text x="615" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#C2410C">Billed on every call</text>

  <!-- Panel 4: the new column -->
  <rect x="767" y="100" width="201" height="170" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#374151">
    <text x="777" y="121" font-weight="700" fill="#1F2937">chunk_id</text>
    <text x="862" y="121" font-weight="700" fill="#1F2937">content_type</text>
    <line x1="777" y1="129" x2="958" y2="129" stroke="#D1D5DB" stroke-width="1"/>
    <text x="777" y="150">CT-99001::1</text><text x="862" y="150">objection</text>
    <text x="777" y="172">CT-99001::2</text><text x="862" y="172">requirement</text>
    <text x="777" y="194">CT-99002::1</text><text x="862" y="194">pain_point</text>
  </g>
  <text x="867" y="228" text-anchor="middle" font-size="10" fill="#4B5563">One label per chunk,</text>
  <text x="867" y="242" text-anchor="middle" font-size="10" fill="#4B5563">ready to filter and test</text>
  <rect x="772" y="292" width="190" height="24" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="867" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">A plain table you can query</text>
</svg>
