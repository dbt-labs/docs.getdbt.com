<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Context engineering in one picture</title>
  <desc id="desc">Your text, such as call transcripts, support tickets, CRM notes, and contracts, goes into context models in one dbt project. The context models chunk, embed, and label the text and end in a knowledge base. The models are tested, traced to their source, and cost-limited like any other dbt model. An agent reads the knowledge base, answers a question, and cites its source.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="300" rx="14" fill="#FFFFFF"/>

  <!-- Project boundary -->
  <rect x="295" y="10" width="455" height="280" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="30" font-size="11" font-weight="700" letter-spacing="1" fill="#6B7280">ONE dbt PROJECT · SAME TEAM · SAME TESTS · SAME LINEAGE</text>

  <!-- Panel 1: your text -->
  <rect x="15" y="40" width="215" height="220" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <text x="30" y="62" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C">START</text>
  <text x="30" y="82" font-size="16" font-weight="700" fill="#1F2937">Your text</text>
  <text x="30" y="97" font-size="11" fill="#4B5563">Messy, long, hard to search</text>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <rect x="30" y="112" width="185" height="24" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="122" y="128">Call transcripts</text>
    <rect x="30" y="142" width="185" height="24" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="122" y="158">Support tickets</text>
    <rect x="30" y="172" width="185" height="24" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="122" y="188">CRM notes</text>
    <rect x="30" y="202" width="185" height="24" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/><text x="122" y="218">Contracts</text>
  </g>
  <text x="122" y="246" text-anchor="middle" font-size="10" fill="#6B7280">…and more</text>

  <!-- Arrow: text to context models -->
  <path d="M233 150 L305 150" stroke="#8b93a1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Panel 2: context models -->
  <rect x="310" y="40" width="425" height="220" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <text x="325" y="62" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C">YOU BUILD THIS</text>
  <text x="325" y="82" font-size="16" font-weight="700" fill="#1F2937">Context models</text>
  <text x="325" y="97" font-size="11" fill="#4B5563">Turn your text into something an agent can search and cite</text>

  <g font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">
    <rect x="325" y="118" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#FF694A" stroke-width="1.5"/><text x="357" y="135">chunk</text>
    <text x="397" y="135" font-size="12" fill="#8b93a1">›</text>
    <rect x="405" y="118" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#FF694A" stroke-width="1.5"/><text x="437" y="135">embed</text>
    <text x="477" y="135" font-size="12" fill="#8b93a1">›</text>
    <rect x="485" y="118" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#FF694A" stroke-width="1.5" stroke-dasharray="4 3"/><text x="517" y="135">label</text>
    <text x="557" y="135" font-size="12" fill="#8b93a1">›</text>
    <rect x="565" y="118" width="125" height="26" rx="13" fill="#FFE9E3" stroke="#FF694A" stroke-width="1.5"/><text x="627" y="135">knowledge base</text>
  </g>
  <g font-size="10" fill="#4B5563" text-anchor="middle">
    <text x="357" y="162">Split into</text><text x="357" y="174">pieces</text>
    <text x="437" y="162">Turn into</text><text x="437" y="174">numbers</text>
    <text x="517" y="162">Tag with</text><text x="517" y="174">an LLM</text>
    <text x="627" y="162">One searchable</text><text x="627" y="174">table</text>
  </g>

  <rect x="325" y="196" width="395" height="50" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="522" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">Tested · traced to its source · cost-limited</text>
  <text x="522" y="234" text-anchor="middle" font-size="10" fill="#4B5563">The same discipline you already give your metrics</text>

  <!-- Arrow: context models to agent -->
  <path d="M738 150 L788 150" stroke="#8b93a1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Panel 3: agent -->
  <rect x="795" y="40" width="190" height="220" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <text x="810" y="62" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C">READS IT</text>
  <text x="810" y="82" font-size="16" font-weight="700" fill="#1F2937">Agent</text>
  <text x="810" y="97" font-size="11" fill="#4B5563">Finds it, cites it, trusts it</text>

  <rect x="807" y="108" width="166" height="42" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="817" y="123" font-size="10" font-weight="700" fill="#6B7280">QUESTION</text>
  <text x="817" y="139" font-size="10" fill="#1F2937">“Why were deliveries late?”</text>

  <rect x="807" y="158" width="166" height="76" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="817" y="173" font-size="10" font-weight="700" fill="#6B7280">ANSWER</text>
  <text x="817" y="189" font-size="10" fill="#1F2937">A truck slid on ice in the</text>
  <text x="817" y="202" font-size="10" fill="#1F2937">storm and missed its window.</text>
  <text x="817" y="222" font-size="10" fill="#4B5563" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cites CT-99021::1</text>
</svg>
