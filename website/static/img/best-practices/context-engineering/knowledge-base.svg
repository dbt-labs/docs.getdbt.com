<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="752" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How a knowledge base fits into your project</title>
  <desc id="desc">Three sources (tickets, calls, and legal docs) each have their own source models that chunk, embed, and optionally classify the text. One knowledge base model calls the knowledge_base macro, which renames each source's columns to a shared set and stacks the sources into one table in the warehouse. An agent or app searches that table with a filter on the account, and every hit says which system and row it came from.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <!-- Light card so the text outside the panels stays readable on a dark page -->
  <rect x="0" y="0" width="1000" height="470" rx="14" fill="#FFFFFF"/>

  <!-- Warehouse boundary -->
  <rect x="5" y="8" width="745" height="454" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="20" y="28" font-size="11" font-weight="700" letter-spacing="1" fill="#6B7280">YOUR WAREHOUSE</text>

  <!-- Panels -->
  <rect x="20" y="48" width="140" height="396" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="185" y="48" width="230" height="396" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="435" y="48" width="300" height="396" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="815" y="48" width="180" height="396" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>

  <!-- Panel headers -->
  <text x="90" y="68" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C">THE DATA</text>
  <text x="90" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Sources</text>
  <text x="90" y="102" text-anchor="middle" font-size="11" fill="#4B5563">Different columns each</text>

  <text x="300" y="68" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C">YOU WRITE THESE</text>
  <text x="300" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Source models</text>
  <text x="300" y="102" text-anchor="middle" font-size="11" fill="#4B5563">One set per source</text>

  <text x="585" y="68" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C">YOU WRITE ONE CALL</text>
  <text x="585" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Knowledge base</text>
  <text x="585" y="102" text-anchor="middle" font-size="11" fill="#4B5563">One model, one table</text>

  <text x="905" y="68" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#C2410C">QUERIES IT</text>
  <text x="905" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Agent or app</text>
  <text x="905" y="102" text-anchor="middle" font-size="11" fill="#4B5563">Searches by meaning</text>

  <!-- Source cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#374151">
    <rect x="30" y="118" width="120" height="84" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect x="30" y="118" width="5" height="84" rx="2" fill="#3B82F6"/>
    <text x="44" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2937">Tickets</text>
    <text x="44" y="154">ticket_id</text>
    <text x="44" y="168">account_id</text>
    <text x="44" y="182">body</text>
    <text x="44" y="196">created_at</text>

    <rect x="30" y="213" width="120" height="84" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect x="30" y="213" width="5" height="84" rx="2" fill="#2F9E6E"/>
    <text x="44" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2937">Calls</text>
    <text x="44" y="249">chunk_id</text>
    <text x="44" y="263">client_id</text>
    <text x="44" y="277">chunk_text</text>
    <text x="44" y="291">artifact_ts</text>

    <rect x="30" y="308" width="120" height="84" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect x="30" y="308" width="5" height="84" rx="2" fill="#FF694A"/>
    <text x="44" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2937">Legal docs</text>
    <text x="44" y="344">doc_id</text>
    <text x="44" y="358">org_id</text>
    <text x="44" y="372">clause_text</text>
    <text x="44" y="386">signed_on</text>
  </g>

  <!-- Arrows: sources to source models -->
  <g stroke="#8b93a1" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="152" y1="160" x2="183" y2="160"/>
    <line x1="152" y1="255" x2="183" y2="255"/>
    <line x1="152" y1="350" x2="183" y2="350"/>
  </g>

  <!-- Source model chains -->
  <g font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">
    <rect x="197" y="147" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="228" y="164">chunk</text>
    <rect x="267" y="147" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="298" y="164">embed</text>
    <rect x="337" y="147" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="368" y="164">classify</text>

    <rect x="197" y="242" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#2F9E6E" stroke-width="1.5"/>
    <text x="228" y="259">chunk</text>
    <rect x="267" y="242" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#2F9E6E" stroke-width="1.5"/>
    <text x="298" y="259">embed</text>
    <rect x="337" y="242" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#2F9E6E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="368" y="259">classify</text>

    <rect x="197" y="337" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#FF694A" stroke-width="1.5"/>
    <text x="228" y="354">chunk</text>
    <rect x="267" y="337" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#FF694A" stroke-width="1.5"/>
    <text x="298" y="354">embed</text>
    <rect x="337" y="337" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#FF694A" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="368" y="354">classify</text>
  </g>
  <g font-size="12" fill="#8b93a1" text-anchor="middle">
    <text x="263" y="164">›</text><text x="333" y="164">›</text>
    <text x="263" y="259">›</text><text x="333" y="259">›</text>
    <text x="263" y="354">›</text><text x="333" y="354">›</text>
  </g>
  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#6B7280">Dashed means optional</text>

  <!-- AI cost tag -->
  <rect x="200" y="404" width="200" height="24" rx="12" fill="#FFE9E3" stroke="#FF694A" stroke-width="1.2"/>
  <text x="300" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#C2410C">AI calls: embed and classify</text>

  <!-- Bus: source models to the macro -->
  <g stroke="#8b93a1" stroke-width="2.5" fill="none">
    <line x1="400" y1="160" x2="425" y2="160"/>
    <line x1="400" y1="255" x2="425" y2="255"/>
    <line x1="400" y1="350" x2="425" y2="350"/>
    <line x1="425" y1="350" x2="425" y2="141"/>
  </g>
  <line x1="425" y1="141" x2="445" y2="141" stroke="#8b93a1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Macro box -->
  <rect x="447" y="118" width="276" height="46" rx="8" fill="#FFE9E3" stroke="#FF694A" stroke-width="1.5"/>
  <text x="585" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">knowledge_base()</text>
  <text x="585" y="153" text-anchor="middle" font-size="10" fill="#4B5563">Renames each source's columns, then stacks them</text>

  <line x1="585" y1="165" x2="585" y2="194" stroke="#8b93a1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Result table -->
  <rect x="447" y="198" width="276" height="176" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="457" y="215" font-size="10" font-weight="700" fill="#6B7280">TABLE IN YOUR WAREHOUSE</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#374151">
    <text x="457" y="238" font-weight="700" fill="#1F2937">source_type</text>
    <text x="535" y="238" font-weight="700" fill="#1F2937">account_key</text>
    <text x="612" y="238" font-weight="700" fill="#1F2937">text</text>
    <line x1="457" y1="245" x2="713" y2="245" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="461" cy="264" r="4" fill="#3B82F6"/>
    <text x="470" y="267">ticket</text><text x="535" y="267">ACME</text><text x="612" y="267">Renewal at risk</text>
    <circle cx="461" cy="288" r="4" fill="#2F9E6E"/>
    <text x="470" y="291">call</text><text x="535" y="291">ACME</text><text x="612" y="291">Wants a discount</text>
    <circle cx="461" cy="312" r="4" fill="#FF694A"/>
    <text x="470" y="315">legal doc</text><text x="535" y="315">ACME</text><text x="612" y="315">24-month term</text>
  </g>
  <text x="457" y="344" font-size="10" fill="#6B7280">Plus source_id, embedding, ts,</text>
  <text x="457" y="358" font-size="10" fill="#6B7280">citation_url, and classification</text>

  <!-- No-AI tag -->
  <rect x="495" y="404" width="180" height="24" rx="12" fill="#ECFDF5" stroke="#2F9E6E" stroke-width="1.2"/>
  <text x="585" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">No AI calls here</text>

  <!-- Query arrow -->
  <line x1="813" y1="265" x2="727" y2="265" stroke="#8b93a1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="782" y="257" text-anchor="middle" font-size="11" fill="#4B5563">queries</text>

  <!-- Agent panel content -->
  <rect x="827" y="118" width="156" height="46" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="837" y="136" font-size="10" font-weight="700" fill="#6B7280">FILTER</text>
  <text x="837" y="153" font-size="10" fill="#1F2937" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">account_key = 'ACME'</text>
  <line x1="905" y1="165" x2="905" y2="181" stroke="#8b93a1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="827" y="183" width="156" height="126" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="837" y="201" font-size="10" font-weight="700" fill="#6B7280">TOP HITS</text>
  <circle cx="841" cy="220" r="4" fill="#3B82F6"/>
  <text x="850" y="223" font-size="10" fill="#1F2937" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ticket · T-1</text>
  <circle cx="841" cy="242" r="4" fill="#2F9E6E"/>
  <text x="850" y="245" font-size="10" fill="#1F2937" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">call · C-1::1</text>
  <text x="837" y="268" font-size="10" fill="#4B5563">Each hit says which</text>
  <text x="837" y="282" font-size="10" fill="#4B5563">system and row it</text>
  <text x="837" y="296" font-size="10" fill="#4B5563">came from</text>

  <text x="905" y="344" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">People ask the agent.</text>
  <text x="905" y="360" text-anchor="middle" font-size="11" fill="#4B5563">They never query the table.</text>
</svg>
