<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="800" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <rect x="20" y="105" width="150" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="95" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">AI assistant</text>
  <text x="95" y="165" text-anchor="middle" font-size="12" fill="#374151">writes SQL, calls</text>
  <text x="95" y="181" text-anchor="middle" font-size="12" fill="#374151">execute_sql</text>

  <rect x="230" y="105" width="150" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="305" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">dbt MCP server</text>
  <text x="305" y="165" text-anchor="middle" font-size="12" fill="#374151">forwards request</text>
  <text x="305" y="181" text-anchor="middle" font-size="12" fill="#374151">to the platform</text>

  <rect x="440" y="105" width="150" height="90" rx="10" fill="#fff1ee" stroke="#ff694a" stroke-width="2"/>
  <text x="515" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">dbt platform</text>
  <text x="515" y="165" text-anchor="middle" font-size="12" fill="#374151">compiles SQL and</text>
  <text x="515" y="181" text-anchor="middle" font-size="12" fill="#374151">dbt Jinja (ref)</text>

  <rect x="650" y="105" width="130" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="715" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Warehouse</text>
  <text x="715" y="165" text-anchor="middle" font-size="12" fill="#374151">runs the query</text>
  <text x="715" y="181" text-anchor="middle" font-size="12" fill="#374151">as you</text>

  <line x1="170" y1="140" x2="228" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="140" x2="438" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="140" x2="648" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <text x="305" y="72" text-anchor="middle" font-size="12" fill="#374151">sends your token, dev</text>
  <text x="305" y="88" text-anchor="middle" font-size="12" fill="#374151">environment ID, and user ID</text>
  <text x="515" y="72" text-anchor="middle" font-size="12" fill="#374151">uses your development</text>
  <text x="515" y="88" text-anchor="middle" font-size="12" fill="#374151">credentials, not production</text>

  <path d="M715 197 V250 H95 V199" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="405" y="272" text-anchor="middle" font-size="13" fill="#1f2937">Results come back to your assistant as a table</text>
  <text x="405" y="292" text-anchor="middle" font-size="11" fill="#6b7280">What the query can do is set by your warehouse permissions</text>
</svg>
