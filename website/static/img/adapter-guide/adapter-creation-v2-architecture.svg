<svg viewBox="0 0 710 490" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">dbt Core v2 adapter architecture</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Layered diagram showing how a query flows through dbt Core v2, the adapter match arms and AdapterType enum, ADBC C ABI, the warehouse driver, and the warehouse.</desc>

  <rect width="700" height="480" fill="var(--bg-primary,#ffffff)" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-primary,#111)" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:auto">dbt Core v2 adapter architecture</text>

  <!-- ── dbt Core v2 ── -->
  <rect x="40" y="52" width="620" height="52" rx="8" fill="var(--bg-secondary,#f4f4f5)" stroke="var(--border,#d4d4d8)" stroke-width="1.2" style="fill:rgb(244, 244, 245);stroke:rgb(212, 212, 216);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="350" y="73" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary,#111)" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">dbt Core v2 (Rust monorepo)</text>
  <text x="350" y="90" text-anchor="middle" font-size="11" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">compilation, macro execution, materialization orchestration</text>
  <line x1="350" y1="104" x2="350" y2="120" stroke="var(--text-tertiary,#999)" stroke-width="1.5" marker-end="url(#arr)" style="fill:rgb(0, 0, 0);stroke:rgb(153, 153, 153);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ── Community contribution zone ── -->
  <rect x="30" y="120" width="640" height="172" rx="10" fill="none" stroke="#f97316" stroke-width="1.8" stroke-dasharray="6 3" style="fill:none;stroke:rgb(249, 115, 22);color:rgb(0, 0, 0);stroke-width:1.8px;stroke-dasharray:6px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="44" y="115" width="178" height="16" rx="4" fill="#f97316" style="fill:rgb(249, 115, 22);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="133" y="126" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10px;font-weight:600;text-anchor:middle;dominant-baseline:auto">Community contribution zone</text>

