  <rect x="50" y="132" width="270" height="144" rx="7" fill="var(--bg-secondary,#f4f4f5)" stroke="var(--border,#d4d4d8)" stroke-width="1.2" style="fill:rgb(244, 244, 245);stroke:rgb(212, 212, 216);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="185" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary,#111)" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">adapter_impl.rs + crates</text>
  <text x="70" y="174" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">match adapter_type {</text>
  <text x="82" y="190" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">connect_timeout()</text>
  <text x="82" y="205" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">quote_char()</text>
  <text x="82" y="220" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">relation_from_str()</text>
  <text x="82" y="235" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">list_schemas() …</text>
  <text x="70" y="252" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">}  (~13 files total)</text>

  <!-- AdapterType enum box -->
  <rect x="380" y="132" width="270" height="144" rx="7" fill="var(--bg-secondary,#f4f4f5)" stroke="var(--border,#d4d4d8)" stroke-width="1.2" style="fill:rgb(244, 244, 245);stroke:rgb(212, 212, 216);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="515" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary,#111)" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">AdapterType enum</text>
  <text x="515" y="174" text-anchor="middle" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">DuckDB | ClickHouse |</text>
  <text x="515" y="190" text-anchor="middle" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Exasol | Snowflake |</text>
  <text x="515" y="206" text-anchor="middle" font-size="10.5" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">BigQuery | Databricks |</text>
  <text x="515" y="227" text-anchor="middle" font-size="11" font-weight="600" fill="#f97316" style="fill:rgb(249, 115, 22);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:auto">MyWarehouse  ← you add this</text>
  <text x="515" y="250" text-anchor="middle" font-size="10" fill="var(--text-tertiary,#888)" style="fill:rgb(136, 136, 136);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">exhaustive — compile error if unhandled</text>

  <line x1="320" y1="204" x2="380" y2="204" stroke="var(--border,#d4d4d8)" stroke-width="1" stroke-dasharray="4 2" style="fill:rgb(0, 0, 0);stroke:rgb(212, 212, 216);color:rgb(0, 0, 0);stroke-width:1px;stroke-dasharray:4px, 2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="350" y1="292" x2="350" y2="308" stroke="var(--text-tertiary,#999)" stroke-width="1.5" marker-end="url(#arr)" style="fill:rgb(0, 0, 0);stroke:rgb(153, 153, 153);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ── ADBC C ABI ── -->
  <rect x="40" y="308" width="620" height="48" rx="8" fill="var(--bg-secondary,#f4f4f5)" stroke="var(--border,#d4d4d8)" stroke-width="1.2" style="fill:rgb(244, 244, 245);stroke:rgb(212, 212, 216);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="350" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary,#111)" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">ADBC C ABI</text>
  <text x="350" y="344" text-anchor="middle" font-size="11" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">standard binary interface — Core v2 loads driver .so/.dylib by filename from system path</text>
  <line x1="350" y1="356" x2="350" y2="372" stroke="var(--text-tertiary,#999)" stroke-width="1.5" marker-end="url(#arr)" style="fill:rgb(0, 0, 0);stroke:rgb(153, 153, 153);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ── Driver ── -->
  <rect x="40" y="372" width="620" height="48" rx="8" fill="var(--bg-secondary,#f4f4f5)" stroke="var(--border,#d4d4d8)" stroke-width="1.2" style="fill:rgb(244, 244, 245);stroke:rgb(212, 212, 216);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="350" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary,#111)" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">ADBC driver (shared library)</text>
  <text x="350" y="408" text-anchor="middle" font-size="11" fill="var(--text-secondary,#555)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">contributed separately — apache/arrow-adbc, ADBC driver foundry, or custom</text>
  <line x1="350" y1="420" x2="350" y2="436" stroke="var(--text-tertiary,#999)" stroke-width="1.5" marker-end="url(#arr)" style="fill:rgb(0, 0, 0);stroke:rgb(153, 153, 153);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ── Warehouse ── -->
  <rect x="40" y="436" width="620" height="28" rx="8" fill="var(--bg-secondary,#f4f4f5)" stroke="var(--border,#d4d4d8)" stroke-width="1.2" style="fill:rgb(244, 244, 245);stroke:rgb(212, 212, 216);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="350" y="455" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-primary,#111)" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">Warehouse</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="var(--text-tertiary,#999)"/>
    </marker>
  </defs>
</svg>