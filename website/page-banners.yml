# Page-specific banners.
#
# Each entry renders a banner in place of the global announcement bar on the
# listed page(s). Banners are baked into the static HTML at build time, so they
# appear with no flash of the global banner.
#
# Per entry:
#   paths / path (required): one path (string) or a list of paths. Use the
#                            page's URL path, e.g. /docs/introduction.
#   text (required):         banner message; inline HTML is supported.
#   link (optional):         URL the banner links to.
#   open_in_new_tab (optional): open the link in a new tab.


- paths:
    - /docs/lake-compute
    - /docs/lake-compute/compute-onboarding
  text: "See Lake Compute in action: join our upcoming webinar on cost-optimized, multi-engine transformations with dbt and Apache Iceberg on October 7th. <b>Save your seat</b>"
  link: "https://www.getdbt.com/resources/webinars/cost-optimized-transformations-with-dbt-and-apache-iceberg-on-open-multi-engine-compute/?utm_medium=internal&utm_source=docs&utm_campaign=fy-2027_cost-optimized-transformations_aw&utm_content=____&utm_term=all_all__"
  open_in_new_tab: true

- paths:
    - /docs/build/iceberg/adapters/snowflake-iceberg-support
    - /docs/build/iceberg/adapters/duckdb-iceberg-support
    - /docs/build/iceberg/adapters/databricks-iceberg-support
    - /docs/build/iceberg/adapters/bigquery-iceberg-support
    - /docs/mesh/cross-platform-mesh
  text: "See this taken further: join us for our webinar on cost-optimized transformations with dbt, Apache Iceberg, and multi-engine compute on October 7th. <b>Save your seat</b>"
  link: "https://www.getdbt.com/resources/webinars/cost-optimized-transformations-with-dbt-and-apache-iceberg-on-open-multi-engine-compute/?utm_medium=internal&utm_source=docs&utm_campaign=fy-2027_cost-optimized-transformations_aw&utm_content=____&utm_term=all_all__"
  open_in_new_tab: true
